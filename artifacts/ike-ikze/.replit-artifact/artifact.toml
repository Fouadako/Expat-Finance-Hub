kind = "web"
previewPath = "/"
title = "IKE & IKZE Guide in 2026 Poland"
version = "1.0.0"
id = "artifacts/ike-ikze"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19865

[services.development]
run = "pnpm --filter @workspace/ike-ikze run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ike-ikze", "run", "build" ]
serve = "static"
publicDir = "artifacts/ike-ikze/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19865"
BASE_PATH = "/"
